services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-game}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-game}
      POSTGRES_DB: ${POSTGRES_DB:-game}
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-dev-access-key}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-dev-secret-key}
      S3_BUCKET: ${S3_BUCKET:-game}
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8888/buckets/$${S3_BUCKET}/ > /dev/null"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres:
  seaweedfs:
