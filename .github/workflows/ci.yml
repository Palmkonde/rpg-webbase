name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # The job name is the status-check context the `main` ruleset requires.
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # Pinned: Cargo.toml denies clippy's pedantic/nursery groups, which grow every release.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy
      - run: bun install --frozen-lockfile
      - run: bun run ${{ matrix.task }}
