name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, test]

    # Only the test task needs them; a service whose image is empty isn't started.
    services:
      postgres:
        image: ${{ matrix.task == 'test' && 'postgres:18' || '' }}
        env:
          POSTGRES_USER: game
          POSTGRES_PASSWORD: game
          POSTGRES_DB: game
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U game -d game"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      seaweedfs:
        image: ${{ matrix.task == 'test' && 'chrislusf/seaweedfs:4.48' || '' }}
        env:
          AWS_ACCESS_KEY_ID: ci-access-key
          AWS_SECRET_ACCESS_KEY: ci-secret-key
          S3_BUCKET: game
        ports:
          - 8333:8333
        options: >-
          --health-cmd "curl -sf http://localhost:8888/buckets/game/ > /dev/null"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      DATABASE_URL: postgres://game:game@localhost:5432/game
      S3_ENDPOINT: http://localhost:8333
      S3_BUCKET: game
      S3_ACCESS_KEY_ID: ci-access-key
      S3_SECRET_ACCESS_KEY: ci-secret-key
      S3_REGION: us-east-1
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2

      # Pinned: Cargo.toml denies clippy's pedantic/nursery groups, which grow every release.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy
      - run: bun install --frozen-lockfile
      - run: bun run ${{ matrix.task }}
