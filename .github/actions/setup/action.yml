name: Set up the toolchain
description: Bun, Rust (with the WASM target the CLI builds for) and the workspace's dependencies. Run it after actions/checkout.

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2

    # Pinned: Cargo.toml denies clippy's pedantic/nursery groups, which grow every release.
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.98.1
        components: clippy
        targets: wasm32-unknown-unknown
    - run: bun install --frozen-lockfile
      shell: bash
