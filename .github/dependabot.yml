version: 2
updates:
  # Actions are pinned by major tag only (`checkout@v7`), so ignoring majors here would stop every update.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # `bun`, not `npm`: only the bun updater rewrites `bun.lock`, which CI installs with --frozen-lockfile.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    # Majors are upgrades we start on purpose, not weekly PRs.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: cargo
    directory: /packages/clsc/compiler
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
